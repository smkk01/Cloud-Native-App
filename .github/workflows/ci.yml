name: SmartNote CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
     
      - name: Restore packages
        run: dotnet restore SmartNote.slnx
     
      - name: Run tests
        run: dotnet test SmartNote.slnx --no-restore

      - name: Build application
        run: dotnet build SmartNote.slnx --no-restore
