name: SmartNote CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
     
      - name: Restore packages
        run: dotnet restore SmartNote.slnx
     
      - name: Run tests
        run: dotnet test SmartNote.slnx --no-restore

      - name: Build application
        run: dotnet build SmartNote.slnx --no-restore  

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      
      - name: Build Docker image
        run: |
          docker build \
          -f SmartNote.Api/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/smartnote-api:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/smartnote-api:${{ github.sha }}
          
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Azure Container App
        run: |
          if ! az containerapp show --name smartnote-cloud-api --resource-group SmartNoteResourceGroup --output none 2>/dev/null; then
            echo "::warning::Container app 'smartnote-cloud-api' not found in 'SmartNoteResourceGroup'; skipping deployment. Create it in Azure first."
            exit 0
          fi
          az containerapp update \
            --name smartnote-cloud-api \
            --resource-group SmartNoteResourceGroup \
            --image ${{ secrets.DOCKER_USERNAME }}/smartnote-api:${{ github.sha }}
